version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: raidbrowsai
      POSTGRES_USER: raiduser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_placeholder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - raid-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - raid-network

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-admin123}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=raidbrowsai
      - DB_POSTGRESDB_USER=raiduser
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-secure_password_placeholder}
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      - postgres
      - redis
    networks:
      - raid-network

  # RaidbrowsAI Backend API
  raid-api:
    build: 
      context: ./raidbrowser-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://raiduser:${POSTGRES_PASSWORD:-secure_password_placeholder}@postgres:5432/raidbrowsai
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-me}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5678
      - LITELLM_BASE_URL=http://host.docker.internal:31415
      - LITELLM_API_KEY=freellmapi-36776e993a9163487ea2fbf90b7b3163283699a8546d550c
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - raid-network

  # RaidbrowsAI Web Frontend
  raid-web:
    build:
      context: ./raidbrowser-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NEXT_PUBLIC_APP_NAME=RaidbrowsAI
    ports:
      - "3000:3000"
    depends_on:
      - raid-api
    networks:
      - raid-network

  # Nginx Reverse Proxy with SSL
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - certbot-etc:/etc/letsencrypt
    depends_on:
      - raid-api
      - raid-web
    networks:
      - raid-network

  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL:-admin@example.com} --agree-tos -d yourdomain.com -d www.yourdomain.com
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx
    networks:
      - raid-network

  # Certbot renewal cron job
  cron:
    image: cron
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "touch /var/log/cron.log; echo '0 * * * * /usr/bin/certbot renew --quiet >> /var/log/cron.log 2>&1' | crontab -; cron -f"]
    volumes:
      - certbot-var:/var/lib/letsencrypt
      - ./certbot:/etc/certbot
    networks:
      - raid-network

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  certbot-etc:
  certbot-var:

networks:
  raid-network:
    driver: bridge
